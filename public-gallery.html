<!DOCTYPE html>
  <html lang="en">
  <head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Public Gallery -- Eve Thompson Photography</title>
<meta name="description" content="A public gallery of photography work by Eve Thompson Photography." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/css/style.css" />
  </head>
  <body>

  <header class="topbar">
  <div class="topbar__brand">Eve Thompson Photography</div>
<nav class="topbar__nav">
<a href="index.html" class="topbar__navlink">Home</a>
  <a href="public-gallery.html" class="topbar__navlink is-active">Public Gallery</a>
  <a href="book.html" class="topbar__navlink">Book a Session</a>
  </nav>
  </header>

  <div class="page-header">
  <h1>Public Gallery</h1>
  </div>

  <main class="masonry" id="publicGalleryGrid"></main>
  <p class="empty-state" id="publicGalleryEmpty">Photos coming soon.</p>

<div class="lightbox" id="lightbox">
<div class="lightbox__bar">
<button class="icon-btn" id="lightboxClose">&larr; Back</button>
  </div>
  <div class="lightbox__stage">
  <button class="lightbox__nav lightbox__nav--prev" id="lbPrev">&larr;</button>
  <img id="lbImage" src="" alt="" />
  <button class="lightbox__nav lightbox__nav--next" id="lbNext">&rarr;</button>
  </div>
  <div class="lightbox__caption" id="lbCaption"></div>
  </div>

  <footer class="home-footer">
  <nav class="home-footer__nav">
  <a href="index.html">Home</a>
  <a href="public-gallery.html">Public Gallery</a>
  <a href="book.html">Book a Session</a>
</nav>
<p class="home-footer__copyright">All content Copyright &copy; <span id="year"></span> Eve Thompson Photography</p>
</footer>

<script>
document.getElementById("year").textContent = new Date().getFullYear();

// Add photos here as they're provided. Each entry needs a src (path under
// assets/images/public-gallery/) and an alt description.
var PUBLIC_GALLERY_IMAGES = [
  { src: "assets/images/public-gallery/water-droplet-grass.jpg", alt: "Macro shot of a single water droplet resting on a blade of grass" },
  { src: "assets/images/public-gallery/dew-daisy-flower.jpg", alt: "White daisy-like flower covered in dew drops" },
  { src: "assets/images/public-gallery/dew-sunlit-leaf.jpg", alt: "Dew drops on a sunlit green leaf" },
  { src: "assets/images/public-gallery/dew-clover-flower.jpg", alt: "Clover-like white flower with dew drops and a green center" },
  { src: "assets/images/public-gallery/dew-covered-leaf-stem.jpg", alt: "Leaf and stem covered in many water droplets" },
  { src: "assets/images/public-gallery/white-pelican-portrait.jpg", alt: "Portrait of a white pelican against a black background" },
  { src: "assets/images/public-gallery/yellow-rose-bud.jpg", alt: "Yellow rose bud just beginning to open" },
  { src: "assets/images/public-gallery/calves-in-pasture.jpg", alt: "Two young calves standing in a green pasture" },
  { src: "assets/images/public-gallery/river-rapids.jpg", alt: "Water rushing over rocks in a river" },
  { src: "assets/images/public-gallery/two-chestnut-horses.jpg", alt: "Two chestnut horses standing together in a field" },
  { src: "assets/images/public-gallery/horse-tail-closeup.jpg", alt: "Close-up of a horse's tail and hindquarters" },
  { src: "assets/images/public-gallery/yellow-rose-bloom.jpg", alt: "A yellow rose in full bloom" },
  { src: "assets/images/public-gallery/ocean-wave.jpg", alt: "An ocean wave breaking" },
  { src: "assets/images/public-gallery/pink-clover-dew.jpg", alt: "Pink clover flower covered in dew drops" },
  { src: "assets/images/public-gallery/robber-fly-leaf.jpg", alt: "A robber fly resting on a leaf" },
  { src: "assets/images/public-gallery/dew-drops-leaf-macro.jpg", alt: "Macro of dew drops on a leaf" },
  { src: "assets/images/public-gallery/tern-in-flight.jpg", alt: "A tern in flight over the ocean" },
  { src: "assets/images/public-gallery/horse-muzzle-closeup.jpg", alt: "Extreme close-up of a horse's muzzle and whiskers" },
];

(function () {
var grid = document.getElementById("publicGalleryGrid");
var emptyState = document.getElementById("publicGalleryEmpty");
var lightbox = document.getElementById("lightbox");
var lbImage = document.getElementById("lbImage");
var lbCaption = document.getElementById("lbCaption");
var currentIndex = 0;

function renderGrid() {
if (!PUBLIC_GALLERY_IMAGES.length) {
emptyState.style.display = "block";
grid.style.display = "none";
return;
}
emptyState.style.display = "none";
grid.style.display = "block";
grid.innerHTML = "";
PUBLIC_GALLERY_IMAGES.forEach(function (photo, i) {
var tile = document.createElement("div");
tile.className = "tile";
var img = document.createElement("img");
  img.src = photo.src;
img.alt = photo.alt || "";
img.loading = "lazy";
img.addEventListener("click", function () { openLightbox(i); });
tile.appendChild(img);
grid.appendChild(tile);
});
}

function openLightbox(index) {
currentIndex = index;
showCurrent();
lightbox.classList.add("is-open");
}

function closeLightbox() {
lightbox.classList.remove("is-open");
}

function showCurrent() {
var photo = PUBLIC_GALLERY_IMAGES[currentIndex];
lbImage.src = photo.src;
lbImage.alt = photo.alt || "";
lbCaption.textContent = photo.alt || "";
}

function showNext() {
currentIndex = (currentIndex + 1) % PUBLIC_GALLERY_IMAGES.length;
showCurrent();
}

function showPrev() {
currentIndex = (currentIndex - 1 + PUBLIC_GALLERY_IMAGES.length) % PUBLIC_GALLERY_IMAGES.length;
showCurrent();
}

document.getElementById("lightboxClose").addEventListener("click", closeLightbox);
document.getElementById("lbNext").addEventListener("click", showNext);
document.getElementById("lbPrev").addEventListener("click", showPrev);
document.addEventListener("keydown", function (e) {
if (!lightbox.classList.contains("is-open")) return;
if (e.key === "Escape") closeLightbox();
if (e.key === "ArrowRight") showNext();
if (e.key === "ArrowLeft") showPrev();
});

renderGrid();
})();
</script>
  </body>
  </html>
