<!DOCTYPE html>
  <html lang="en">
  <head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Client Gallery</title>
  <meta name="description" content="Photo galleries -- view, favorite, download, and purchase prints." />
  <link rel="stylesheet" href="assets/css/style.css" />
  </head>
  <body>

  <header class="topbar">
    <div class="topbar__brand" id="brandName">Client Gallery</div>
    <div class="topbar__search">
      <input type="search" id="searchInput" placeholder="Search collections..." />
    </div>
    <nav class="topbar__nav">
      <a href="index.html" class="topbar__navlink">Home</a>
      <a href="collections.html" class="topbar__navlink is-active">Gallery</a>
    </nav>
  </header>

  <div class="page-header">
    <h1>Collections</h1>
  </div>

  <main>
    <div id="collectionGrid" class="collection-grid"></div>
    <div id="emptyState" class="empty-state" style="display:none;">No collections match your search.</div>
  </main>

  <p class="footer-note">This is a template gallery site. Edit <code>data/galleries.json</code> to add your own collections and photos.</p>

  <script src="assets/js/main.js"></script>

  </html>
