<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Prints & Products — Eve Thompson Photography</title>
  <link rel="stylesheet" href="shop.css" />
</head>
<body>
  <header class="shop-header">
    <a href="https://evethompsonphotography.com/" class="back-link">&larr; Back to home</a>
    <h1>Prints &amp; Products</h1>
    <button id="cart-toggle" class="cart-toggle" aria-haspopup="true" aria-expanded="false">
      Cart <span id="cart-count">0</span>
    </button>
  </header>

  <p id="load-error" class="load-error" hidden></p>

  <div id="shop-filters" class="shop-filters" role="group" aria-label="Filter by product type" hidden></div>

  <main id="product-grid" class="product-grid" aria-live="polite">
    <p class="loading">Loading products…</p>
  </main>

  <!-- Cart / checkout drawer -->
  <aside id="cart-drawer" class="cart-drawer" aria-hidden="true">
    <div class="cart-drawer-inner">
      <div class="cart-drawer-head">
        <h2>Your cart</h2>
        <button id="cart-close" aria-label="Close cart">&times;</button>
      </div>

      <div id="cart-items" class="cart-items">
        <p class="cart-empty">Your cart is empty.</p>
      </div>

      <div class="cart-subtotal">
        <span>Subtotal</span>
        <span id="cart-subtotal-amount">$0.00</span>
      </div>

      <section id="shipping-section" class="shipping-section" hidden>
        <h3>Shipping details</h3>
        <form id="shipping-form">
          <label>Full name
            <input type="text" name="name" required />
          </label>
          <label>Email
            <input type="email" name="email" required />
          </label>
          <label>Address line 1
            <input type="text" name="address1" required />
          </label>
          <label>Address line 2 (optional)
            <input type="text" name="address2" />
          </label>
          <div class="field-row">
            <label>City
              <input type="text" name="city" required />
            </label>
            <label>State / region
              <input type="text" name="state_code" placeholder="e.g. TX" />
            </label>
          </div>
          <div class="field-row">
            <label>ZIP / postal code
              <input type="text" name="zip" required />
            </label>
            <label>Country code
              <input type="text" name="country_code" placeholder="e.g. US" required maxlength="2" />
            </label>
          </div>
          <label>Phone (optional)
            <input type="tel" name="phone" />
          </label>

          <button type="submit" id="get-rates-btn" class="secondary-btn">Check shipping cost</button>
        </form>

        <div id="rates-list" class="rates-list" hidden></div>
      </section>

      <button id="checkout-btn" class="checkout-btn" disabled>
        Continue to payment
      </button>
      <p class="checkout-note">You'll enter your card details securely on the next screen (powered by Stripe).</p>
    </div>
  </aside>
  <div id="cart-overlay" class="cart-overlay" hidden></div>

  <!-- Variant picker modal -->
  <div id="variant-modal" class="modal" hidden>
    <div class="modal-inner">
      <button id="variant-modal-close" class="modal-close" aria-label="Close">&times;</button>
      <img id="variant-modal-image" src="" alt="" />
      <h2 id="variant-modal-title"></h2>
      <label>Options
        <select id="variant-select"></select>
      </label>
      <label>Quantity
        <input type="number" id="variant-qty" value="1" min="1" />
      </label>
      <p id="variant-price" class="variant-price"></p>
      <button id="variant-add-btn" class="checkout-btn">Add to cart</button>
    </div>
  </div>

  <script src="shop.js"></script>
</body>
</html>
